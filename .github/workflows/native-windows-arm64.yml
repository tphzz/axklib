name: 11 Build - Windows ARM64
run-name: "${{ github.workflow }} | ${{ github.ref_name }} | ${{ inputs.debug && 'Debug' || 'Release' }}"

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-windows-arm64-only-${{ github.ref }}-${{ inputs.debug && 'debug' || 'release' }}
  cancel-in-progress: false
  queue: max

jobs:
  checks:
    uses: ./.github/workflows/native-checks.yml
    with:
      debug: ${{ inputs.debug }}

  native:
    name: Windows ARM64
    needs: checks
    concurrency:
      group: native-apple-silicon-host
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/native-platform.yml
    with:
      debug: ${{ inputs.debug }}
      name: Windows ARM64
      runner_labels: '["self-hosted","Windows","ARM64"]'
      artifact: windows-arm64
      desktop_platform: windows
      desktop_architecture: arm64
      triplet: arm64-windows-axk
      build_testing: "ON"
      run_tests: true
      msvc_arch: arm64
      msvc_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
