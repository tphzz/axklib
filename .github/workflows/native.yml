name: Native CI

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug"
        required: false
        default: false
        type: boolean
      notarize_macos:
        description: "macOS: Notarize"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture
    runs-on: [self-hosted, Linux, X64, jammy, docker]
    concurrency:
      group: native-architecture-${{ github.ref }}-${{ inputs.debug && 'debug' || 'release' }}
      cancel-in-progress: true
    steps:
      - name: Checkout axklib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
      - name: Enforce architecture budgets
        run: cmake -DAXK_SOURCE_ROOT="${GITHUB_WORKSPACE}" -P cmake/ArchitectureCheck.cmake

  release-tools:
    name: Release tools
    needs: architecture
    runs-on: [self-hosted, Linux, X64, jammy, docker]
    concurrency:
      group: native-release-tools-${{ github.ref }}-${{ inputs.debug && 'debug' || 'release' }}
      cancel-in-progress: true
    steps:
      - name: Checkout axklib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          enable-cache: true
      - name: Validate release tools
        run: |
          uv --project tools/python run ruff check tools/python
          uv --project tools/python run mypy tools/python
          uv --project tools/python run pytest tools/python/tests
      - name: Validate selected release ref
        run: |
          cmake -DAXK_VERSION_SOURCE_DIR="${GITHUB_WORKSPACE}" \
            -DAXK_VERSION_PROJECT_MODULE="${GITHUB_WORKSPACE}/library/cmake/AxkProjectVersion.cmake" \
            -DAXK_VERSION_OUTPUT_METADATA="${GITHUB_WORKSPACE}/build/version_metadata.json" \
            -P library/cmake/GenerateProjectVersion.cmake
          python tools/python/release_metadata.py release-target \
            --version-metadata-file build/version_metadata.json \
            --ref-type "${GITHUB_REF_TYPE}" --ref-name "${GITHUB_REF_NAME}"
  desktop-static:
    name: Desktop static checks
    needs: architecture
    runs-on: [self-hosted, Linux, X64, jammy, docker]
    concurrency:
      group: native-desktop-static-${{ github.ref }}-${{ inputs.debug && 'debug' || 'release' }}
      cancel-in-progress: true
    steps:
      - name: Checkout axklib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.15.1
          standalone: true
          cache: true
          cache_dependency_path: apps/axkdeck/pnpm-lock.yaml
      - name: Install desktop dependencies
        working-directory: apps/axkdeck
        run: pnpm install --frozen-lockfile
      - name: Validate desktop sources
        working-directory: apps/axkdeck
        run: |
          pnpm version:check
          pnpm version:test
          pnpm contract:check
          pnpm format:check
          pnpm test
          pnpm check
          pnpm build
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.85"
          components: rustfmt
      - name: Validate Rust formatting
        run: cargo fmt --manifest-path apps/axkdeck/src-tauri/Cargo.toml -- --check

  native:
    name: ${{ matrix.name }}
    needs:
      - release-tools
      - desktop-static
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Linux x64
            runner_labels: '["self-hosted","Linux","X64","jammy","docker"]'
            artifact: linux-x64
            desktop_platform: linux
            desktop_architecture: x64
            triplet: x64-linux-axk
            build_testing: "ON"
            run_tests: true
          - name: Linux ARM64
            runner_labels: '["self-hosted","Linux","ARM64","jammy","docker"]'
            artifact: linux-arm64
            desktop_platform: linux
            desktop_architecture: arm64
            triplet: arm64-linux-axk
            build_testing: "ON"
            run_tests: true
          - name: Windows x64
            runner_labels: '["self-hosted","Windows","X64"]'
            artifact: windows-x64
            desktop_platform: windows
            desktop_architecture: x64
            triplet: x64-windows-axk
            build_testing: "ON"
            run_tests: true
            msvc_arch: x64
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - name: Windows ARM64
            runner_labels: '["self-hosted","Windows","ARM64"]'
            artifact: windows-arm64
            desktop_platform: windows
            desktop_architecture: arm64
            triplet: arm64-windows-axk
            build_testing: "ON"
            run_tests: true
            msvc_arch: arm64
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    concurrency:
      group: native-${{ matrix.artifact }}-${{ github.ref }}-${{ inputs.debug && 'debug' || 'release' }}
      cancel-in-progress: true
    steps:
      - name: Checkout axklib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Expose Git Bash to subsequent steps
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $gitRoot = Split-Path (Split-Path $git -Parent) -Parent
          $bash = (Get-Item (Join-Path $gitRoot 'bin\bash.exe') -ErrorAction Stop).FullName
          Split-Path $bash -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $bash --version

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os != 'Windows'
        with:
          python-version: "3.13.14"

      - name: Verify preinstalled Windows Python
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          python -c "import platform,sys;
          assert sys.version_info[:3] == (3, 13, 14), sys.version;
          expected='${{ matrix.desktop_architecture == 'arm64' && 'arm64' || 'amd64' }}';
          assert platform.machine().lower() == expected, (platform.machine(), expected)"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Verify preinstalled Linux C++23 toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_CODENAME" = jammy
          command -v clang-18
          command -v clang++-18
          ninja_path="$(command -v ninja)"
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
          echo "NINJA_EXE=$ninja_path" >> "$GITHUB_ENV"
          clang++-18 --version
          ninja --version
          printf '#include <expected>\nint main() { std::expected<int, int> value(1); return *value - 1; }\n' \
            | clang++-18 -std=c++23 -stdlib=libc++ -x c++ -fsyntax-only -

      - name: Verify preinstalled Linux desktop packaging toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for command in curl wget file pkg-config patchelf rpm bsdtar dpkg-deb; do
            command -v "$command"
          done
          for module in \
            openssl \
            xdo \
            gtk+-3.0 \
            webkit2gtk-4.1 \
            ayatana-appindicator3-0.1 \
            librsvg-2.0; do
            if ! pkg-config --exists "$module"; then
              echo "Linux runner image is missing pkg-config module: $module" >&2
              exit 1
            fi
          done

      - name: Resolve native cache inputs
        id: cache-inputs
        shell: bash
        run: |
          echo "vcpkg_revision=$(git rev-parse HEAD:external/vcpkg)" >> "$GITHUB_OUTPUT"
          echo "dependency_fingerprint=${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'CMakePresets.json', 'library/CMakeLists.txt', 'library/cmake/triplets/**', 'library/cmake/toolchains/**', 'library/cmake/ports/**') }}" >> "$GITHUB_OUTPUT"

      - name: Configure vcpkg binary cache
        shell: bash
        run: |
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg/archives" >> "$GITHUB_ENV"
          cmake -E make_directory "$RUNNER_TEMP/vcpkg/archives"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/vcpkg/archives
          key: vcpkg-v3-${{ matrix.triplet }}-${{ steps.cache-inputs.outputs.vcpkg_revision }}-${{ steps.cache-inputs.outputs.dependency_fingerprint }}

      - name: Locate Visual Studio 2026
        id: vs2026
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -version '[18.0,19.0)' -products '*' `
            -requires '${{ matrix.msvc_component }}' `
            -property installationPath |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($installation)) {
            throw 'Visual Studio 18 with the C++ toolchain was not found'
          }
          "path=$installation" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Configure Visual Studio 2026
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4
        with:
          arch: ${{ matrix.msvc_arch }}
          vs-path: ${{ steps.vs2026.outputs.path }}

      - name: Verify Visual Studio 2026 compiler and Ninja
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($env:VisualStudioVersion -notlike '18.*') {
            throw "Expected Visual Studio 18, found '$env:VisualStudioVersion'"
          }
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          if ($compiler -notlike '*\Microsoft Visual Studio\18\*') {
            throw "Expected Visual Studio 18 cl.exe, found '$compiler'"
          }
          $linker = Join-Path (Split-Path $compiler -Parent) 'link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "MSVC linker was not found beside '$compiler'"
          }
          $ninja = Join-Path $env:VSINSTALLDIR 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe'
          if (-not (Test-Path -LiteralPath $ninja -PathType Leaf)) {
            throw "Visual Studio Ninja was not found at '$ninja'"
          }
          & $ninja --version
          "CC=cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NINJA_EXE=$($ninja.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $cargoTarget = if ('${{ matrix.desktop_architecture }}' -eq 'arm64') {
            'AARCH64_PC_WINDOWS_MSVC'
          } else {
            'X86_64_PC_WINDOWS_MSVC'
          }
          "CARGO_TARGET_${cargoTarget}_LINKER=$($linker.Replace('\', '/'))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $compiler"
          Write-Host "Using $linker for Rust target $cargoTarget"

      - name: Fingerprint native toolchain
        id: native-toolchain
        shell: bash
        run: >-
          python tools/python/native_build_cache.py fingerprint
          --triplet "${{ matrix.triplet }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Restore native incremental build cache
        id: native-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build/native/${{ inputs.debug && 'debug' || 'release' }}
            !build/native/${{ inputs.debug && 'debug' || 'release' }}/Testing/**
            !build/native/${{ inputs.debug && 'debug' || 'release' }}/*.spdx.json
          key: native-v3-${{ matrix.triplet }}-${{ inputs.debug && 'debug' || 'release' }}-${{ steps.native-toolchain.outputs.toolchain_fingerprint }}-${{ steps.cache-inputs.outputs.vcpkg_revision }}-${{ steps.cache-inputs.outputs.dependency_fingerprint }}-${{ github.sha }}
          restore-keys: |
            native-v3-${{ matrix.triplet }}-${{ inputs.debug && 'debug' || 'release' }}-${{ steps.native-toolchain.outputs.toolchain_fingerprint }}-${{ steps.cache-inputs.outputs.vcpkg_revision }}-${{ steps.cache-inputs.outputs.dependency_fingerprint }}-

      - name: Prepare native incremental build cache
        id: native-cache-state
        shell: bash
        run: >-
          python tools/python/native_build_cache.py prepare
          --source-root "${{ github.workspace }}"
          --build-directory "${{ github.workspace }}/build/native/${{ inputs.debug && 'debug' || 'release' }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: powershell
        run: .\external\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Set reproducible release timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Configure native build
        id: configure-native
        shell: bash
        run: |
          set -euo pipefail
          configuration="${{ inputs.debug && 'debug' || 'release' }}"
          workspace="$PWD"
          if [ "$RUNNER_OS" = Windows ]; then
            workspace="$(cygpath -m "$PWD")"
          fi
          build_root="$workspace/build/native/$configuration"
          cmake_arguments=(
            -DAXK_BUILD_SERVER=ON
            -DBUILD_TESTING=${{ matrix.build_testing }}
            "-DAXK_SBOM_FILE=$build_root/axklib-sdk.spdx.json"
            "-DAXK_CLI_SBOM_FILE=$build_root/axklib-cli.spdx.json"
            "-DAXK_SERVER_SBOM_FILE=$build_root/axklib-server.spdx.json"
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
            "-DVCPKG_OVERLAY_TRIPLETS=$workspace/library/cmake/triplets"
            "-DCMAKE_MAKE_PROGRAM=$NINJA_EXE"
          )
          if [ "$RUNNER_OS" = Linux ]; then
            cmake_arguments+=(
              "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$workspace/library/cmake/toolchains/LinuxClang18Libcxx.cmake"
            )
          fi
          cmake --preset "$configuration" "${cmake_arguments[@]}"

      - name: Build native targets
        shell: bash
        run: cmake --build --preset ${{ inputs.debug && 'debug' || 'release' }}

      - name: Verify source tree remains clean
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=normal)"
          if [ -n "$status" ]; then
            printf 'CI source tree is modified:\n%s\n' "$status" >&2
            exit 1
          fi

      - name: Finalize native incremental build cache
        id: finalize-native-cache
        shell: bash
        run: >-
          python tools/python/native_build_cache.py finalize
          --source-root "${{ github.workspace }}"
          --build-directory "${{ github.workspace }}/build/native/${{ inputs.debug && 'debug' || 'release' }}"

      - name: Resolve and verify build identity
        id: package
        shell: bash
        run: |
          set -euo pipefail
          root="build/native/${{ inputs.debug && 'debug' || 'release' }}"
          sha="$(git rev-parse --short=7 HEAD)"
          test -n "$sha"
          python tools/python/release_metadata.py resolve \
            --version-metadata-file "$root/version_metadata.json" \
            --package-basename-file "$root/package_basename.txt" \
            --ref-type "${GITHUB_REF_TYPE}" \
            --ref-name "${GITHUB_REF_NAME}" \
            --platform "${{ matrix.artifact }}" \
            --configuration "${{ inputs.debug && 'Debug' || 'Release' }}" \
            --github-output "$GITHUB_OUTPUT"
          cli="$root/apps/cli/axklib"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cli="${cli}.exe"
          fi
          python tools/python/release_metadata.py verify-cli \
            --version-metadata-file "$root/version_metadata.json" \
            --package-basename-file "$root/package_basename.txt" \
            --cli "$cli" --git-sha-short "$sha" --ref-name "${GITHUB_REF_NAME}"

      - name: Generate component SBOMs
        shell: bash
        run: |
          set -euo pipefail
          root="build/native/${{ inputs.debug && 'debug' || 'release' }}"
          uv --project tools/python run python tools/python/generate_sbom.py --axklib-root . \
            --version-metadata-file "$root/version_metadata.json" \
            --package-basename-file "$root/package_basename.txt" --profile sdk \
            --output "$root/axklib-sdk.spdx.json"
          uv --project tools/python run python tools/python/generate_sbom.py --axklib-root . \
            --version-metadata-file "$root/version_metadata.json" \
            --package-basename-file "$root/package_basename.txt" --profile cli \
            --output "$root/axklib-cli.spdx.json"
          uv --project tools/python run python tools/python/generate_sbom.py --axklib-root . \
            --version-metadata-file "$root/version_metadata.json" \
            --package-basename-file "$root/package_basename.txt" --profile server \
            --output "$root/axklib-server.spdx.json"

      - name: Test native targets
        if: matrix.run_tests
        shell: bash
        run: ctest --preset ${{ inputs.debug && 'debug' || 'release' }} --label-exclude server-smoke

      - name: Stage and inspect native components
        shell: bash
        run: |
          set -euo pipefail
          root="build/native/${{ inputs.debug && 'debug' || 'release' }}"
          scan="build/tmp/package-scan-${{ matrix.artifact }}"
          rm -rf "$scan"
          mkdir -p "$scan/sdk" "$scan/cli" "$scan/server"
          cmake --install "$root" --prefix "$scan/sdk" --component sdk
          cmake --install "$root" --prefix "$scan/cli" --component cli
          cmake --install "$root" --prefix "$scan/server" --component server
          project_version="${{ steps.package.outputs.project_version }}"
          soversion="${{ steps.package.outputs.soversion }}"
          library_args=(
            --allow-library axklib.dll
            --allow-library libaxklib.so
            --allow-library "libaxklib.so.${soversion}"
            --allow-library "libaxklib.so.${project_version}"
            --allow-library libaxklib.dylib
            --allow-library "libaxklib.${soversion}.dylib"
            --allow-library "libaxklib.${project_version}.dylib"
          )
          python tools/python/inspect_package.py "$scan/sdk" "${library_args[@]}"
          python tools/python/inspect_package.py "$scan/cli"
          python tools/python/inspect_package.py "$scan/server"
          test -f "$scan/sdk/share/axklib/axklib.spdx.json"
          test -f "$scan/cli/share/axklib/axklib-cli.spdx.json"
          server_binary="axklib-server"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            server_binary="${server_binary}.exe"
          fi
          test -f "$scan/server/bin/$server_binary"
          test -f "$scan/server/share/axklib/axklib-server.spdx.json"
          test -f "$scan/server/share/axklib/server/openapi-v1.json"
          test -f "$scan/server/share/doc/axklib/server.md"
          test -f "$scan/server/share/licenses/openssl/copyright"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.15.1
          # @pnpm/exe does not provide a usable native executable for Windows ARM64.
          standalone: ${{ runner.os != 'Windows' || runner.arch != 'ARM64' }}
          cache: true
          cache_dependency_path: apps/axkdeck/pnpm-lock.yaml

      - name: Configure job-local Cargo home
        shell: bash
        run: |
          cargo_home="$RUNNER_TEMP/cargo-home"
          cmake -E make_directory "$cargo_home"
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.85"
          components: clippy

      - name: Restore desktop Cargo download cache
        id: desktop-cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/cache
            ${{ runner.temp }}/cargo-home/registry/index
            ${{ runner.temp }}/cargo-home/git/db
          key: axkdeck-cargo-downloads-v1-${{ matrix.artifact }}-${{ hashFiles('apps/axkdeck/src-tauri/Cargo.lock') }}

      - name: Install desktop dependencies
        working-directory: apps/axkdeck
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Select the tested native server for axkdeck
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/build/native/${{ inputs.debug && 'debug' || 'release' }}"
          server="$root/apps/server/axklib-server"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            server="${server}.exe"
          fi
          test -f "$server"
          test -f "$root/version_metadata.json"
          test -f "$root/package_basename.txt"
          "$server" --print-version
          echo "AXKLIB_SERVER_BINARY=$server" >> "$GITHUB_ENV"
          echo "AXKLIB_BUILD_DIRECTORY=$root" >> "$GITHUB_ENV"
          echo "AXKLIB_VERSION_METADATA_FILE=$root/version_metadata.json" >> "$GITHUB_ENV"
          echo "AXKLIB_PACKAGE_BASENAME_FILE=$root/package_basename.txt" >> "$GITHUB_ENV"
          echo "AXKDECK_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Test desktop Rust integration
        if: >-
          matrix.artifact == 'linux-x64' ||
          matrix.artifact == 'windows-x64'
        shell: bash
        run: cargo test --manifest-path apps/axkdeck/src-tauri/Cargo.toml

      - name: Lint desktop Rust integration
        if: matrix.artifact == 'linux-x64'
        shell: bash
        run: |
          cargo clippy --manifest-path apps/axkdeck/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path apps/axkdeck/src-tauri/Cargo.toml --all-targets --release -- -D warnings

      - name: Generate desktop SBOM from the tested native server
        shell: bash
        run: |
          set -euo pipefail
          root="build/native/${{ inputs.debug && 'debug' || 'release' }}"
          cargo_target=$(rustc -vV | sed -n 's/^host: //p')
          cargo metadata --manifest-path apps/axkdeck/src-tauri/Cargo.toml \
            --locked --format-version 1 --filter-platform "$cargo_target" \
            > "$root/axkdeck-cargo-metadata.json"
          (cd apps/axkdeck && pnpm licenses list --prod --json) \
            > "$root/axkdeck-pnpm-licenses.json"
          uv --project tools/python run python tools/python/generate_sbom.py \
            --axklib-root . \
            --axkdeck-root apps/axkdeck \
            --cargo-metadata-file "$root/axkdeck-cargo-metadata.json" \
            --pnpm-license-file "$root/axkdeck-pnpm-licenses.json" \
            --vcpkg-installed-root "$root/vcpkg_installed/${{ matrix.triplet }}" \
            --license-bundle apps/axkdeck/src-tauri/resources/THIRD-PARTY-LICENSES.txt \
            --version-metadata-file "$root/version_metadata.json" \
            --package-basename-file "$root/package_basename.txt" \
            --profile server \
            --output apps/axkdeck/src-tauri/resources/axkdeck.spdx.json

      - name: Remove cached desktop bundles
        shell: bash
        run: rm -rf apps/axkdeck/src-tauri/target/*/bundle apps/axkdeck/src-tauri/target/*/*/bundle

      - name: Build Linux desktop packages
        if: runner.os == 'Linux'
        working-directory: apps/axkdeck
        shell: bash
        run: pnpm desktop:build

      - name: Build Windows desktop package
        if: runner.os == 'Windows'
        working-directory: apps/axkdeck
        shell: bash
        run: pnpm desktop:build

      - name: Save desktop Cargo download cache
        if: ${{ success() && steps.desktop-cargo-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/cache
            ${{ runner.temp }}/cargo-home/registry/index
            ${{ runner.temp }}/cargo-home/git/db
          key: axkdeck-cargo-downloads-v1-${{ matrix.artifact }}-${{ hashFiles('apps/axkdeck/src-tauri/Cargo.lock') }}

      - name: Reject nested native desktop builds
        shell: bash
        run: |
          if find apps/axkdeck/src-tauri/target -type f -name CMakeCache.txt -print -quit | grep .; then
            echo 'Cargo unexpectedly configured a nested axklib build.' >&2
            exit 1
          fi

      - name: Inspect Linux desktop packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle=apps/axkdeck/src-tauri/target/release/bundle
          scan=build/tmp/axkdeck-package-scan-${{ matrix.artifact }}
          rm -rf "$scan"
          mkdir -p "$scan/deb" "$scan/rpm"
          deb=$(find "$bundle/deb" -type f -name '*.deb' -print -quit)
          rpm=$(find "$bundle/rpm" -type f -name '*.rpm' -print -quit)
          test -n "$deb"
          test -n "$rpm"
          dpkg-deb -x "$deb" "$scan/deb"
          rpm -Kv "$rpm"
          bsdtar -xf "$GITHUB_WORKSPACE/$rpm" -C "$scan/rpm"
          for root in "$scan/deb" "$scan/rpm"; do
            python tools/python/inspect_package.py "$root"
            find "$root" -type f -name axkdeck -print -quit | grep .
            find "$root" -type f -name axklib-server -print -quit | grep .
            find "$root" -type f -name axkdeck.spdx.json -print -quit | grep .
            find "$root" -type f -name LGPL-2.1-or-later.txt -print -quit | grep .
            find "$root" -type f -name THIRD-PARTY-LICENSES.txt -print -quit | grep .
          done

      - name: Install and inspect Windows desktop package
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bundle = Join-Path $PWD 'apps\axkdeck\src-tauri\target\release\bundle\nsis'
          $installer = Get-ChildItem $bundle -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not generated' }
          $install = Join-Path $env:RUNNER_TEMP `
            "axkdeck-installed-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-${{ matrix.artifact }}"
          $process = Start-Process $installer.FullName -ArgumentList '/S', "/D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed with $($process.ExitCode)" }
          python tools/python/inspect_package.py $install
          if (-not (Get-ChildItem $install -Recurse -Filter axkdeck.exe)) { throw 'axkdeck.exe missing' }
          if (-not (Get-ChildItem $install -Recurse -Filter axklib-server.exe)) { throw 'axklib-server.exe missing' }
          if (-not (Get-ChildItem $install -Recurse -Filter axkdeck.spdx.json)) { throw 'desktop SBOM missing' }
          if (-not (Get-ChildItem $install -Recurse -Filter LGPL-2.1-or-later.txt)) { throw 'LGPL notice missing' }
          if (-not (Get-ChildItem $install -Recurse -Filter THIRD-PARTY-LICENSES.txt)) { throw 'third-party license bundle missing' }
          $uninstaller = Get-ChildItem $install -Recurse -Filter 'uninstall.exe' | Select-Object -First 1
          if ($null -eq $uninstaller) { throw 'NSIS uninstaller missing' }
          $process = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS uninstall failed with $($process.ExitCode)" }

      - name: Stage Linux desktop release packages
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          python tools/python/desktop_release.py
          --bundle-directory apps/axkdeck/src-tauri/target/release/bundle
          --extension .deb --extension .rpm
          --output-directory build/artifacts/axkdeck-${{ matrix.artifact }}
          --platform "${{ matrix.desktop_platform }}"
          --architecture "${{ matrix.desktop_architecture }}"
          --axklib-version-metadata build/native/${{ inputs.debug && 'debug' || 'release' }}/version_metadata.json
          --package-basename-file build/native/${{ inputs.debug && 'debug' || 'release' }}/package_basename.txt
          --sbom apps/axkdeck/src-tauri/resources/axkdeck.spdx.json
          --configuration "${{ inputs.debug && 'Debug' || 'Release' }}"

      - name: Stage Windows desktop release package
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          python tools/python/desktop_release.py
          --bundle-directory apps/axkdeck/src-tauri/target/release/bundle/nsis
          --extension .exe
          --output-directory build/artifacts/axkdeck-${{ matrix.artifact }}
          --platform "${{ matrix.desktop_platform }}"
          --architecture "${{ matrix.desktop_architecture }}"
          --axklib-version-metadata build/native/${{ inputs.debug && 'debug' || 'release' }}/version_metadata.json
          --package-basename-file build/native/${{ inputs.debug && 'debug' || 'release' }}/package_basename.txt
          --sbom apps/axkdeck/src-tauri/resources/axkdeck.spdx.json
          --configuration "${{ inputs.debug && 'Debug' || 'Release' }}"

      - name: Upload Linux or Windows desktop packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-axkdeck-${{ matrix.artifact }}
          path: build/artifacts/axkdeck-${{ matrix.artifact }}/*
          if-no-files-found: error

      - name: Package Linux or Windows SDK and CLI archives
        shell: bash
        env:
          AXK_SDK_ARTIFACT_STEM: ${{ steps.package.outputs.sdk_artifact_stem }}
          AXK_CLI_ARTIFACT_STEM: ${{ steps.package.outputs.cli_artifact_stem }}
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            archive_format=zip
          else
            archive_format=tar.gz
          fi
          python tools/python/release_metadata.py package-native \
            --source-directory "build/tmp/package-scan-${{ matrix.artifact }}/sdk" \
            --output-directory build/artifacts \
            --artifact-stem "$AXK_SDK_ARTIFACT_STEM" \
            --component sdk --archive-format "$archive_format"
          python tools/python/release_metadata.py package-native \
            --source-directory "build/tmp/package-scan-${{ matrix.artifact }}/cli" \
            --output-directory build/artifacts \
            --artifact-stem "$AXK_CLI_ARTIFACT_STEM" \
            --component cli --archive-format "$archive_format"

      - name: Verify Linux runtime dependency closure
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root="build/native/${{ inputs.debug && 'debug' || 'release' }}"
          cli_dependencies="$(ldd "$root/apps/cli/axklib")"
          server_dependencies="$(ldd "$root/apps/server/axklib-server")"
          sdk_dependencies="$(ldd "$root/library/libaxklib.so")"
          printf '%s\n' "$cli_dependencies" "$server_dependencies" "$sdk_dependencies"
          if grep -Eqi 'lib(axk|sndfile|soxr|FLAC|ogg|vorbis|opus|mpg123|mp3lame)' \
              <<<"$cli_dependencies"; then
            echo "CLI has a private native runtime dependency" >&2
            exit 1
          fi
          if grep -Eqi 'lib(axk|sndfile|soxr|FLAC|ogg|vorbis|opus|mpg123|mp3lame)' \
              <<<"$server_dependencies"; then
            echo "server has a private native runtime dependency" >&2
            exit 1
          fi
          if grep -Eqi 'lib(sndfile|soxr|FLAC|ogg|vorbis|opus|mpg123|mp3lame)' \
              <<<"$sdk_dependencies"; then
            echo "C++ SDK has a private codec runtime dependency" >&2
            exit 1
          fi

      - name: Verify Windows runtime dependency closure
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $root = "build/native/${{ inputs.debug && 'debug' || 'release' }}"
          $cli = Get-ChildItem $root -Recurse -Filter axklib.exe | Select-Object -First 1
          $server = Get-ChildItem $root -Recurse -Filter axklib-server.exe | Select-Object -First 1
          $sdk = Get-ChildItem $root -Recurse -Filter axklib.dll | Select-Object -First 1
          if ($null -eq $cli -or $null -eq $server -or $null -eq $sdk) {
            throw "native runtime artifacts are missing"
          }
          $cliDependencies = (dumpbin /dependents $cli.FullName) -join "`n"
          $serverDependencies = (dumpbin /dependents $server.FullName) -join "`n"
          $sdkDependencies = (dumpbin /dependents $sdk.FullName) -join "`n"
          Write-Host $cliDependencies
          Write-Host $serverDependencies
          Write-Host $sdkDependencies
          $privateCli = '(?im)^\s+(?:lib)?(?:axk|sndfile|soxr|flac|ogg|vorbis|opus|mpg123|mp3lame)[^\s]*\.dll\s*$'
          $privateCodec = '(?im)^\s+(?:lib)?(?:sndfile|soxr|flac|ogg|vorbis|opus|mpg123|mp3lame)[^\s]*\.dll\s*$'
          if ($cliDependencies -match $privateCli) {
            throw "CLI has a private native runtime dependency: $($Matches[0])"
          }
          if ($serverDependencies -match $privateCli) {
            throw "server has a private native runtime dependency: $($Matches[0])"
          }
          if ($sdkDependencies -match $privateCodec) {
            throw "C++ SDK has a private codec runtime dependency: $($Matches[0])"
          }

      - name: Verify Windows ARM64 output
        if: matrix.triplet == 'arm64-windows-axk'
        shell: powershell
        run: |
          $headers = dumpbin /headers build/native/${{ inputs.debug && 'debug' || 'release' }}/apps/cli/axklib.exe
          $machineHeaders = @($headers | Select-String -Pattern '\bmachine \(')
          $machineHeaders | ForEach-Object { Write-Host $_.Line }
          $arm64Headers = @($headers | Select-String -Pattern '^\s*AA64 machine \(ARM64\)\s*$')
          if ($arm64Headers.Count -eq 0) {
            $detected = ($machineHeaders | ForEach-Object { $_.Line.Trim() }) -join '; '
            throw "axklib.exe is not an ARM64 binary; detected headers: $detected"
          }
          $sdk = Get-ChildItem "build/native/${{ inputs.debug && 'debug' || 'release' }}" `
            -Recurse -Filter axklib.dll | Select-Object -First 1
          $sdkHeaders = dumpbin /headers $sdk.FullName
          if (@($sdkHeaders | Select-String -Pattern '^\s*AA64 machine \(ARM64\)\s*$').Count -eq 0) {
            throw 'axklib.dll is not an ARM64 binary'
          }
          $serverHeaders = dumpbin /headers `
            build/native/${{ inputs.debug && 'debug' || 'release' }}/apps/server/axklib-server.exe
          if (@($serverHeaders | Select-String -Pattern '^\s*AA64 machine \(ARM64\)\s*$').Count -eq 0) {
            throw 'axklib-server.exe is not an ARM64 binary'
          }

      - name: Print native dependency failure logs
        if: failure()
        shell: bash
        run: |
          for root in external/vcpkg/buildtrees build/native; do
            test -d "$root" || continue
            while IFS= read -r log; do
              echo "::group::$log"
              tail -n 300 "$log"
              echo "::endgroup::"
            done < <(find "$root" -type f \
              \( -name '*-out.log' -o -name '*-err.log' -o -name 'vcpkg-manifest-install.log' \) \
              -print | sort)
          done

      - name: Upload native dependency failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-dependency-logs-${{ matrix.triplet }}
          path: |
            external/vcpkg/buildtrees/**/*-out.log
            external/vcpkg/buildtrees/**/*-err.log
            build/native/**/vcpkg-manifest-install.log
          if-no-files-found: warn
          retention-days: 7

      - name: Save vcpkg binary cache after failure
        if: ${{ failure() && steps.configure-native.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/vcpkg/archives
          key: vcpkg-v3-${{ matrix.triplet }}-${{ steps.cache-inputs.outputs.vcpkg_revision }}-${{ steps.cache-inputs.outputs.dependency_fingerprint }}

      - name: Upload Linux or Windows SDK archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ steps.package.outputs.sdk_artifact_stem }}
          path: build/artifacts/${{ steps.package.outputs.sdk_artifact_stem }}.*
          if-no-files-found: error

      - name: Upload Linux or Windows CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ steps.package.outputs.cli_artifact_stem }}
          path: build/artifacts/${{ steps.package.outputs.cli_artifact_stem }}.*
          if-no-files-found: error

      - name: Save native incremental build cache after failure
        if: ${{ failure() && steps.finalize-native-cache.outcome == 'success' && steps.native-build-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build/native/${{ inputs.debug && 'debug' || 'release' }}
            !build/native/${{ inputs.debug && 'debug' || 'release' }}/Testing/**
            !build/native/${{ inputs.debug && 'debug' || 'release' }}/*.spdx.json
          key: native-v3-${{ matrix.triplet }}-${{ inputs.debug && 'debug' || 'release' }}-${{ steps.native-toolchain.outputs.toolchain_fingerprint }}-${{ steps.cache-inputs.outputs.vcpkg_revision }}-${{ steps.cache-inputs.outputs.dependency_fingerprint }}-${{ github.sha }}

  macos-slices:
    name: macOS ARM64 and Intel slices
    needs:
      - release-tools
      - desktop-static
    runs-on: [self-hosted, macOS, ARM64]
    concurrency:
      group: native-macos-slices-${{ github.ref }}-${{ inputs.debug && 'debug' || 'release' }}
      cancel-in-progress: true
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "13.3"
    steps:
      - name: Checkout axklib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Verify selected Xcode toolchain and Rosetta
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          MACOSX_DEPLOYMENT_TARGET: "13.3"
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          clang_path="$(xcrun --sdk macosx --find clang)"
          test -d "$sdk_path"
          test -x "$clang_path"

          verification_directory="$RUNNER_TEMP/axklib-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/macos-rosetta-verification"
          verification_binary="$verification_directory/verification"
          rm -rf "$verification_directory"
          mkdir -p "$verification_directory"
          printf 'int main(void) { return 0; }\n' > "$verification_directory/verification.c"
          xcrun --sdk macosx clang -arch x86_64 \
            -isysroot "$sdk_path" \
            "-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
            "$verification_directory/verification.c" -o "$verification_binary"
          lipo "$verification_binary" -verify_arch x86_64
          /usr/bin/arch -x86_64 "$verification_binary"

          printf 'AXK_MACOS_SDK=%s\n' "$sdk_path" >> "$GITHUB_ENV"
          {
            printf 'developer_dir=%s\n' "$DEVELOPER_DIR"
            printf 'sdk_path=%s\n' "$sdk_path"
            printf 'deployment_target=%s\n' "$MACOSX_DEPLOYMENT_TARGET"
            printf 'host_architecture=%s\n' "$(uname -m)"
            "$clang_path" --version
            cmake --version
            python --version
          }

      - name: Resolve macOS cache inputs
        id: macos-cache-inputs
        shell: bash
        run: |
          echo "vcpkg_revision=$(git rev-parse HEAD:external/vcpkg)" >> "$GITHUB_OUTPUT"
          echo "dependency_fingerprint=${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'CMakePresets.json', 'library/CMakeLists.txt', 'library/cmake/triplets/**', 'library/cmake/toolchains/**', 'library/cmake/ports/**') }}" >> "$GITHUB_OUTPUT"

      - name: Configure run-scoped macOS vcpkg binary cache
        shell: bash
        run: |
          cache="$RUNNER_TEMP/axklib-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/vcpkg/archives"
          mkdir -p "$cache"
          printf 'VCPKG_DEFAULT_BINARY_CACHE=%s\n' "$cache" >> "$GITHUB_ENV"

      - name: Restore macOS dual-architecture vcpkg cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/axklib-${{ github.run_id }}-${{ github.run_attempt }}/vcpkg/archives
          key: vcpkg-v3-macos-dual-${{ steps.macos-cache-inputs.outputs.vcpkg_revision }}-${{ steps.macos-cache-inputs.outputs.dependency_fingerprint }}
          restore-keys: |
            vcpkg-v3-macos-dual-${{ steps.macos-cache-inputs.outputs.vcpkg_revision }}-
            vcpkg-v3-macos-dual-

      - name: Bootstrap vcpkg
        shell: bash
        run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.15.1
          standalone: true
          cache: true
          cache_dependency_path: apps/axkdeck/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.85"
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Restore macOS desktop Cargo download cache
        id: macos-desktop-cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: axkdeck-cargo-downloads-v1-macos-${{ hashFiles('apps/axkdeck/src-tauri/Cargo.lock') }}

      - name: Install desktop dependencies
        working-directory: apps/axkdeck
        run: pnpm install --frozen-lockfile

      - name: Set reproducible release timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build, test, and package both macOS slices
        shell: bash
        env:
          AXK_MACOS_CARGO_ROOT: ${{ runner.temp }}/axklib-${{ github.run_id }}-${{ github.run_attempt }}/cargo
        run: |
          bash tools/release/build_macos_slices.sh \
            --source-directory "$PWD" \
            --configuration "${{ inputs.debug && 'Debug' || 'Release' }}" \
            --sdk-path "$AXK_MACOS_SDK" \
            --deployment-target "$MACOSX_DEPLOYMENT_TARGET" \
            --ref-type "$GITHUB_REF_TYPE" \
            --ref-name "$GITHUB_REF_NAME"

      - name: Save macOS desktop Cargo download cache
        if: ${{ success() && steps.macos-desktop-cargo-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: axkdeck-cargo-downloads-v1-macos-${{ hashFiles('apps/axkdeck/src-tauri/Cargo.lock') }}

      - name: Upload Intel macOS slice
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: slice-macos-x64-${{ github.run_id }}
          path: build/macos-slices/macos-x64/*
          if-no-files-found: error
          retention-days: 2

      - name: Upload ARM64 macOS slice
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: slice-macos-arm64-${{ github.run_id }}
          path: build/macos-slices/macos-arm64/*
          if-no-files-found: error
          retention-days: 2

      - name: Upload macOS slice failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-dependency-logs-macos-${{ github.run_id }}
          path: |
            external/vcpkg/buildtrees/**/*-out.log
            external/vcpkg/buildtrees/**/*-err.log
            build/native/macos-*/**/vcpkg-manifest-install.log
          if-no-files-found: warn
          retention-days: 7

  macos-universal:
    name: macOS universal
    if: github.event_name == 'workflow_dispatch'
    needs:
      - native
      - macos-slices
    runs-on: [self-hosted, macOS, ARM64]
    concurrency:
      group: native-macos-signing
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "13.3"
    steps:
      - name: Checkout axklib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Download Intel slice
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: slice-macos-x64-${{ github.run_id }}
          path: build/tmp

      - name: Download ARM64 slice
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: slice-macos-arm64-${{ github.run_id }}
          path: build/tmp

      - name: Preflight persistent macOS signing keychain
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          signing_keychain="$HOME/Library/Keychains/login.keychain-db"
          password_file="$HOME/.config/developer-id-signing/login-keychain-password"
          runner_user="$(id -un)"

          if [[ ! -f "$signing_keychain" ]]; then
            echo "Signing keychain is missing: $signing_keychain" >&2
            exit 1
          fi
          if [[ ! -f "$password_file" ]]; then
            echo "Signing keychain password file is missing: $password_file" >&2
            exit 1
          fi
          password_owner="$(stat -f '%Su' "$password_file")"
          password_mode="$(stat -f '%Lp' "$password_file")"
          if [[ "$password_owner" != "$runner_user" || "$password_mode" != 600 ]]; then
            echo "Signing keychain password file must be owned by $runner_user with mode 600." >&2
            printf 'Found owner=%s mode=%s.\n' "$password_owner" "$password_mode" >&2
            exit 1
          fi
          keychain_password="$(<"$password_file")"
          if [[ -z "$keychain_password" || "$keychain_password" == *$'\n'* ||
                "$keychain_password" == *$'\r'* ]]; then
            echo "Signing keychain password file must contain one nonempty line." >&2
            exit 1
          fi
          echo "::add-mask::$keychain_password"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$signing_keychain" >/dev/null
          security list-keychains -d user -s \
            "$signing_keychain" \
            /Library/Keychains/System.keychain \
            /System/Library/Keychains/SystemRootCertificates.keychain
          unset keychain_password

          identity_record="$(
            security find-identity -v -p codesigning "$signing_keychain" 2>&1 |
              python tools/python/macos_signing.py
          )" || {
            echo "expected exactly one Developer ID Application identity." >&2
            security find-identity -v -p codesigning "$signing_keychain" >&2 || true
            exit 1
          }
          IFS='|' read -r fingerprint team_id <<< "$identity_record"
          if [[ -z "$fingerprint" || -z "$team_id" ]]; then
            echo "expected exactly one Developer ID Application identity." >&2
            exit 1
          fi

          verification_directory="$RUNNER_TEMP/axklib-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/macos-signing-verification"
          verification_binary="$verification_directory/verification"
          rm -rf "$verification_directory"
          mkdir -p "$verification_directory"
          printf 'int main(void) { return 0; }\n' > "$verification_directory/verification.c"
          xcrun --sdk macosx clang \
            -isysroot "$(xcrun --sdk macosx --show-sdk-path)" \
            "-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
            "$verification_directory/verification.c" -o "$verification_binary"
          codesign --force --timestamp --options runtime \
            --sign "$fingerprint" "$verification_binary"
          codesign --verify --strict --verbose=2 "$verification_binary"
          "$verification_binary"

          if [[ "${{ inputs.notarize_macos }}" == "true" ]]; then
            xcrun notarytool history \
              --keychain-profile developer-id-notary \
              > "$verification_directory/notary-history.json"
          fi
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
          printf 'team_id=%s\n' "$team_id" >> "$GITHUB_OUTPUT"

      - name: Assemble and verify universal native binaries
        shell: bash
        run: |
          set -euo pipefail
          cmp build/tmp/macos-x64-package-basename.txt \
            build/tmp/macos-arm64-package-basename.txt
          cmp build/tmp/macos-x64-version-metadata.json \
            build/tmp/macos-arm64-version-metadata.json
          mkdir -p build/tmp/{x86_64,arm64,universal} build/artifacts
          tar -xzf build/tmp/macos-x64.tar.gz -C build/tmp/x86_64
          tar -xzf build/tmp/macos-arm64.tar.gz -C build/tmp/arm64
          cp -R build/tmp/arm64/. build/tmp/universal/

          lipo -create \
            build/tmp/x86_64/bin/axklib \
            build/tmp/arm64/bin/axklib \
            -output build/tmp/universal/bin/axklib
          lipo -create \
            build/tmp/x86_64/bin/axklib-server \
            build/tmp/arm64/bin/axklib-server \
            -output build/tmp/universal/bin/axklib-server

          while IFS= read -r arm64_library; do
            relative_path="${arm64_library#build/tmp/arm64/}"
            x64_library="build/tmp/x86_64/$relative_path"
            universal_library="build/tmp/universal/$relative_path"
            test -f "$x64_library"
            lipo -create "$x64_library" "$arm64_library" -output "$universal_library"
          done < <(find build/tmp/arm64/lib -type f \
            \( -name 'libaxk*.a' -o -name 'libaxk*.dylib' \) -print | sort)

          lipo build/tmp/universal/bin/axklib -verify_arch x86_64 arm64
          lipo -info build/tmp/universal/bin/axklib
          lipo build/tmp/universal/bin/axklib-server -verify_arch x86_64 arm64
          lipo -info build/tmp/universal/bin/axklib-server
          while IFS= read -r library; do
            lipo "$library" -verify_arch x86_64 arm64
            lipo -info "$library"
          done < <(find build/tmp/universal/lib -type f \
            \( -name 'libaxk*.a' -o -name 'libaxk*.dylib' \) -print | sort)

          build/tmp/universal/bin/axklib --version
          build/tmp/universal/bin/axklib-server --print-version
          cli_dependencies="$(otool -L build/tmp/universal/bin/axklib)"
          server_dependencies="$(otool -L build/tmp/universal/bin/axklib-server)"
          sdk_library=$(find build/tmp/universal/lib -type f \
            -name 'libaxklib*.dylib' -print -quit)
          test -n "$sdk_library"
          sdk_dependencies="$(otool -L "$sdk_library")"
          printf '%s\n' "$cli_dependencies" "$server_dependencies" "$sdk_dependencies"
          if grep -Eqi 'lib(axk|sndfile|soxr|FLAC|ogg|vorbis|opus|mpg123|mp3lame)' \
              <<<"$(tail -n +2 <<<"$cli_dependencies")"; then
            echo "universal CLI has a private native runtime dependency" >&2
            exit 1
          fi
          if grep -Eqi 'lib(axk|sndfile|soxr|FLAC|ogg|vorbis|opus|mpg123|mp3lame)' \
              <<<"$(tail -n +2 <<<"$server_dependencies")"; then
            echo "universal server has a private native runtime dependency" >&2
            exit 1
          fi
          if grep -Eqi 'lib(sndfile|soxr|FLAC|ogg|vorbis|opus|mpg123|mp3lame)' \
              <<<"$(tail -n +2 <<<"$sdk_dependencies")"; then
            echo "universal C++ SDK has a private codec runtime dependency" >&2
            exit 1
          fi

      - name: Resolve and verify universal build identity
        id: package
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain --untracked-files=normal)"
          if [ -n "$status" ]; then
            printf 'CI source tree is modified:\n%s\n' "$status" >&2
            exit 1
          fi
          sha="$(git rev-parse --short=7 HEAD)"
          package_file="build/tmp/macos-arm64-package-basename.txt"
          version_file="build/tmp/macos-arm64-version-metadata.json"
          python tools/python/release_metadata.py resolve \
            --version-metadata-file "$version_file" --package-basename-file "$package_file" \
            --ref-type "${GITHUB_REF_TYPE}" --ref-name "${GITHUB_REF_NAME}" \
            --platform macos-universal \
            --configuration "${{ inputs.debug && 'Debug' || 'Release' }}" \
            --github-output "$GITHUB_OUTPUT"
          python tools/python/release_metadata.py verify-cli \
            --version-metadata-file "$version_file" --package-basename-file "$package_file" \
            --cli build/tmp/universal/bin/axklib \
            --git-sha-short "$sha" --ref-name "${GITHUB_REF_NAME}"

      - name: Sign macOS universal native binaries
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -euo pipefail
          test -n "$APPLE_SIGNING_IDENTITY"
          xattr -cr build/tmp/universal

          while IFS= read -r library; do
            codesign --force --timestamp --options runtime \
              --sign "$APPLE_SIGNING_IDENTITY" "$library"
            codesign --verify --strict --verbose=2 "$library"
          done < <(find build/tmp/universal/lib -type f -name '*.dylib' -print | sort)

          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" build/tmp/universal/bin/axklib
          codesign --verify --strict --verbose=2 build/tmp/universal/bin/axklib
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" build/tmp/universal/bin/axklib-server
          codesign --verify --strict --verbose=2 build/tmp/universal/bin/axklib-server

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.15.1
          standalone: true
          cache: true
          cache_dependency_path: apps/axkdeck/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.85"
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Restore universal desktop Cargo download cache
        id: universal-desktop-cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: axkdeck-cargo-downloads-v1-macos-${{ hashFiles('apps/axkdeck/src-tauri/Cargo.lock') }}

      - name: Install desktop dependencies
        working-directory: apps/axkdeck
        run: pnpm install --frozen-lockfile

      - name: Generate universal desktop SBOM
        run: |
          cargo metadata --manifest-path apps/axkdeck/src-tauri/Cargo.toml \
            --locked --format-version 1 --filter-platform aarch64-apple-darwin \
            > build/tmp/axkdeck-cargo-arm64-metadata.json
          cargo metadata --manifest-path apps/axkdeck/src-tauri/Cargo.toml \
            --locked --format-version 1 --filter-platform x86_64-apple-darwin \
            > build/tmp/axkdeck-cargo-x64-metadata.json
          (cd apps/axkdeck && pnpm licenses list --prod --json) \
            > build/tmp/axkdeck-pnpm-licenses.json
          uv --project tools/python run python tools/python/generate_sbom.py \
            --axklib-root . \
            --axkdeck-root apps/axkdeck \
            --cargo-metadata-file build/tmp/axkdeck-cargo-arm64-metadata.json \
            --cargo-metadata-file build/tmp/axkdeck-cargo-x64-metadata.json \
            --pnpm-license-file build/tmp/axkdeck-pnpm-licenses.json \
            --vcpkg-installed-root build/tmp/arm64/share/licenses \
            --license-bundle apps/axkdeck/src-tauri/resources/THIRD-PARTY-LICENSES.txt \
            --version-metadata-file build/tmp/macos-arm64-version-metadata.json \
            --package-basename-file build/tmp/macos-arm64-package-basename.txt \
            --profile server \
            --output apps/axkdeck/src-tauri/resources/axkdeck.spdx.json

      - name: Build signed universal macOS desktop DMG
        working-directory: apps/axkdeck
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.fingerprint }}
          AXKLIB_SERVER_BINARY: ${{ github.workspace }}/build/tmp/universal/bin/axklib-server
          AXKLIB_VERSION_METADATA_FILE: ${{ github.workspace }}/build/tmp/macos-arm64-version-metadata.json
          AXKLIB_PACKAGE_BASENAME_FILE: ${{ github.workspace }}/build/tmp/macos-arm64-package-basename.txt
          AXKDECK_BUILD_NUMBER: ${{ github.run_number }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/tmp/macos-universal-cargo-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$APPLE_SIGNING_IDENTITY"
          rm -rf "$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle"
          mkdir -p src-tauri/binaries
          cp "$AXKLIB_SERVER_BINARY" \
            src-tauri/binaries/axklib-server-universal-apple-darwin
          pnpm desktop:build -- --target universal-apple-darwin

      - name: Save universal desktop Cargo download cache
        if: ${{ success() && steps.universal-desktop-cargo-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: axkdeck-cargo-downloads-v1-macos-${{ hashFiles('apps/axkdeck/src-tauri/Cargo.lock') }}

      - name: Stage universal macOS desktop release package
        run: >-
          python tools/python/desktop_release.py
          --bundle-directory build/tmp/macos-universal-cargo-${{ github.run_id }}-${{ github.run_attempt }}/universal-apple-darwin/release/bundle/dmg
          --extension .dmg
          --output-directory build/artifacts/axkdeck-macos-universal
          --platform macos
          --architecture universal
          --axklib-version-metadata build/tmp/macos-arm64-version-metadata.json
          --package-basename-file build/tmp/macos-arm64-package-basename.txt
          --sbom apps/axkdeck/src-tauri/resources/axkdeck.spdx.json
          --configuration "${{ inputs.debug && 'Debug' || 'Release' }}"

      - name: Package signed macOS universal SDK and CLI archives
        shell: bash
        env:
          AXK_SDK_ARTIFACT_STEM: ${{ steps.package.outputs.sdk_artifact_stem }}
          AXK_CLI_ARTIFACT_STEM: ${{ steps.package.outputs.cli_artifact_stem }}
        run: |
          set -euo pipefail
          python tools/python/release_metadata.py package-native \
            --source-directory build/tmp/universal \
            --output-directory build/artifacts \
            --artifact-stem "$AXK_SDK_ARTIFACT_STEM" \
            --component sdk --archive-format zip
          python tools/python/release_metadata.py package-native \
            --source-directory build/tmp/universal \
            --output-directory build/artifacts \
            --artifact-stem "$AXK_CLI_ARTIFACT_STEM" \
            --component cli --archive-format zip

      - name: Notarize macOS universal SDK and CLI archives
        if: inputs.notarize_macos
        shell: bash
        run: |
          set -euo pipefail
          for archive in \
            "build/artifacts/${{ steps.package.outputs.sdk_artifact_stem }}.zip" \
            "build/artifacts/${{ steps.package.outputs.cli_artifact_stem }}.zip"; do
            test -f "$archive"
            xcrun notarytool submit "$archive" \
              --keychain-profile developer-id-notary \
              --wait
          done

      - name: Notarize and staple universal macOS desktop DMG
        if: inputs.notarize_macos
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find build/artifacts/axkdeck-macos-universal \
            -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          xcrun notarytool submit "$dmg" \
            --keychain-profile developer-id-notary \
            --wait
          xcrun stapler staple "$dmg"

      - name: Verify staged universal macOS desktop DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find build/artifacts/axkdeck-macos-universal \
            -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"

          mount_dir=$(mktemp -d)
          mounted=0
          cleanup() {
            if [ "$mounted" -eq 1 ]; then
              hdiutil detach "$mount_dir" >/dev/null || true
            fi
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          mounted=1
          app=$(find "$mount_dir" -type d -name '*.app' -print -quit)
          test -n "$app"
          main="$app/Contents/MacOS/axkdeck"
          sidecar="$app/Contents/MacOS/axklib-server"
          test -f "$main"
          test -f "$sidecar"
          lipo "$main" -verify_arch x86_64 arm64
          lipo "$sidecar" -verify_arch x86_64 arm64
          minimum_system_version=$(
            /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' \
              "$app/Contents/Info.plist"
          )
          test "$minimum_system_version" = "$MACOSX_DEPLOYMENT_TARGET"
          for binary in "$main" "$sidecar"; do
            for architecture in x86_64 arm64; do
              xcrun vtool -show-build -arch "$architecture" "$binary" \
                | grep -Eq "minos[[:space:]]+$MACOSX_DEPLOYMENT_TARGET([[:space:]]|$)"
            done
          done
          test -f "$app/Contents/Resources/licenses/axkdeck.spdx.json"
          test -f "$app/Contents/Resources/licenses/LGPL-2.1-or-later.txt"
          test -f "$app/Contents/Resources/licenses/THIRD-PARTY-LICENSES.txt"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$main"
          codesign --verify --strict --verbose=2 "$sidecar"

          if [ "${{ inputs.notarize_macos }}" = "true" ]; then
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature \
              --verbose=4 "$dmg"
            spctl --assess --type execute --verbose=4 "$app"
          fi

      - name: Upload universal macOS desktop DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-axkdeck-macos-universal
          path: build/artifacts/axkdeck-macos-universal/*
          if-no-files-found: error

      - name: Upload universal macOS SDK archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ steps.package.outputs.sdk_artifact_stem }}
          path: build/artifacts/${{ steps.package.outputs.sdk_artifact_stem }}.zip
          if-no-files-found: error

      - name: Upload universal macOS CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ steps.package.outputs.cli_artifact_stem }}
          path: build/artifacts/${{ steps.package.outputs.cli_artifact_stem }}.zip
          if-no-files-found: error

  draft-release:
    name: Draft release
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.debug }}
    needs:
      - native
      - macos-universal
    runs-on: [self-hosted, Linux, X64, jammy, docker]
    permissions:
      actions: read
      contents: write
    concurrency:
      group: native-draft-release
      cancel-in-progress: false
    steps:
      - name: Checkout axklib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Download release deliverables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: build/release-assets
          merge-multiple: true

      - name: Verify release assets
        run: >-
          python tools/python/release_metadata.py verify-release-assets
          --directory build/release-assets

      - name: Resolve draft release target
        id: release
        run: |
          cmake -DAXK_VERSION_SOURCE_DIR="${GITHUB_WORKSPACE}" \
            -DAXK_VERSION_PROJECT_MODULE="${GITHUB_WORKSPACE}/library/cmake/AxkProjectVersion.cmake" \
            -DAXK_VERSION_OUTPUT_METADATA="${GITHUB_WORKSPACE}/build/version_metadata.json" \
            -P library/cmake/GenerateProjectVersion.cmake
          python tools/python/release_metadata.py release-target \
            --version-metadata-file build/version_metadata.json \
            --ref-type "${GITHUB_REF_TYPE}" --ref-name "${GITHUB_REF_NAME}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Create release notes
        shell: bash
        run: |
          cat > build/release-notes.md <<EOF
          Draft generated by [Native CI run ${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          - Source ref: \`${GITHUB_REF_NAME}\`
          - Commit: \`${GITHUB_SHA}\`
          - Configuration: \`Release\`

          Review the attached SDK archives, CLI archives, and axkdeck installers before publishing this release.
          EOF

      - name: Replace draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          CLEANUP_TAG: ${{ steps.release.outputs.cleanup_tag }}
          VERIFY_TAG: ${{ steps.release.outputs.verify_tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          if is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to replace published release '$RELEASE_TAG'." >&2
              exit 1
            fi
            gh release delete "$RELEASE_TAG" --yes
          fi
          if [[ "$CLEANUP_TAG" == "true" ]] &&
             git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git push origin --delete "refs/tags/$RELEASE_TAG"
          fi

          create_args=(
            "$RELEASE_TAG"
            build/release-assets/*
            --draft
            --title "$RELEASE_TITLE"
            --notes-file build/release-notes.md
          )
          if [[ "$VERIFY_TAG" == "true" ]]; then
            create_args+=(--verify-tag)
          else
            create_args+=(--target "$GITHUB_SHA")
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            create_args+=(--prerelease)
          fi
          gh release create "${create_args[@]}"
