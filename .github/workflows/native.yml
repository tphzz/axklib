name: 00 Full - All Platforms
run-name: "${{ github.workflow }} | ${{ github.ref_name }} | ${{ inputs.debug && 'Debug' || 'Release' }}"

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug"
        required: false
        default: false
        type: boolean
      notarize_macos:
        description: "macOS: Notarize"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Keep one authoritative full run per branch and configuration. Dependencies
# below sequence its platform lanes; standalone builds have independent queues.
concurrency:
  group: native-workflow-${{ github.ref }}-${{ inputs.debug && 'debug' || 'release' }}
  cancel-in-progress: true

jobs:
  checks:
    name: Prerequisite checks
    uses: ./.github/workflows/native-checks.yml
    with:
      debug: ${{ inputs.debug }}

  native-linux-x64:
    name: Linux x64
    needs: checks
    uses: ./.github/workflows/native-platform.yml
    with:
      debug: ${{ inputs.debug }}
      name: Linux x64
      runner_labels: '["self-hosted","Linux","X64","jammy","docker"]'
      artifact: linux-x64
      desktop_platform: linux
      desktop_architecture: x64
      triplet: x64-linux-axk
      build_testing: "ON"
      run_tests: true

  native-windows-x64:
    name: Windows x64
    needs: native-linux-x64
    uses: ./.github/workflows/native-platform.yml
    with:
      debug: ${{ inputs.debug }}
      name: Windows x64
      runner_labels: '["self-hosted","Windows","X64"]'
      artifact: windows-x64
      desktop_platform: windows
      desktop_architecture: x64
      triplet: x64-windows-axk
      build_testing: "ON"
      run_tests: true
      msvc_arch: x64
      msvc_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64

  native-linux-arm64:
    name: Linux ARM64
    needs: checks
    uses: ./.github/workflows/native-platform.yml
    with:
      debug: ${{ inputs.debug }}
      name: Linux ARM64
      runner_labels: '["self-hosted","Linux","ARM64","jammy","docker"]'
      artifact: linux-arm64
      desktop_platform: linux
      desktop_architecture: arm64
      triplet: arm64-linux-axk
      build_testing: "ON"
      run_tests: true

  native-windows-arm64:
    name: Windows ARM64
    needs: native-linux-arm64
    uses: ./.github/workflows/native-platform.yml
    with:
      debug: ${{ inputs.debug }}
      name: Windows ARM64
      runner_labels: '["self-hosted","Windows","ARM64"]'
      artifact: windows-arm64
      desktop_platform: windows
      desktop_architecture: arm64
      triplet: arm64-windows-axk
      build_testing: "ON"
      run_tests: true
      msvc_arch: arm64
      msvc_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64

  macos:
    name: macOS
    needs: native-windows-arm64
    uses: ./.github/workflows/native-macos-platform.yml
    with:
      debug: ${{ inputs.debug }}
      notarize_macos: ${{ inputs.notarize_macos }}
      run_static_checks: false

  draft-release:
    name: Draft release
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.debug }}
    needs:
      - native-windows-x64
      - macos
    runs-on: [self-hosted, Linux, X64, jammy, docker]
    permissions:
      actions: read
      contents: read
    concurrency:
      group: native-draft-release
      cancel-in-progress: false
    steps:
      - name: Checkout axklib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create isolated release staging directory
        id: staging
        shell: bash
        run: |
          root="$(mktemp -d "$RUNNER_TEMP/axklib-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"

      - name: Download release deliverables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: ${{ steps.staging.outputs.root }}/downloads
          merge-multiple: false

      - name: Resolve release version
        env:
          RELEASE_ROOT: ${{ steps.staging.outputs.root }}
        run: |
          cmake -DAXK_VERSION_SOURCE_DIR="${GITHUB_WORKSPACE}" \
            -DAXK_VERSION_PROJECT_MODULE="${GITHUB_WORKSPACE}/library/cmake/AxkProjectVersion.cmake" \
            -DAXK_VERSION_OUTPUT_METADATA="${RELEASE_ROOT}/version_metadata.json" \
            -P library/cmake/GenerateProjectVersion.cmake

      - name: Create release notes
        shell: bash
        env:
          RELEASE_ROOT: ${{ steps.staging.outputs.root }}
        run: |
          cat > "$RELEASE_ROOT/release-notes.md" <<EOF
          Draft generated by [Native CI run ${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          - Source ref: \`${GITHUB_REF_NAME}\`
          - Commit: \`${GITHUB_SHA}\`
          - Configuration: \`Release\`

          Review the attached CLI archives and axkdeck installers before publishing this release.
          EOF

      - name: Prepare release draft and SHA256SUMS
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_ROOT: ${{ steps.staging.outputs.root }}
        run: |
          python3 tools/python/prepare_release.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --version-metadata-file "$RELEASE_ROOT/version_metadata.json" \
            --artifacts-directory "$RELEASE_ROOT/downloads" \
            --notes-file "$RELEASE_ROOT/release-notes.md" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT" --github-step-summary "$GITHUB_STEP_SUMMARY"
