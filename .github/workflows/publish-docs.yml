name: Publish Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, jammy, docker]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install documentation environment
        run: |
          uv --project docs sync --locked
          npm ci

      - name: Verify Mermaid browser runtime
        run: |
          set -euo pipefail
          browser_path="$(
            node --input-type=module -e \
              'import puppeteer from "puppeteer"; process.stdout.write(await puppeteer.executablePath());'
          )"
          if [[ ! -x "$browser_path" ]]; then
            echo "Puppeteer's pinned browser is missing or is not executable: $browser_path" >&2
            exit 1
          fi

          missing_libraries="$(ldd "$browser_path" | awk '/not found/ { print }')"
          if [[ -n "$missing_libraries" ]]; then
            echo "The Linux runner image is missing libraries required by Puppeteer's browser:" >&2
            printf '%s\n' "$missing_libraries" >&2
            exit 1
          fi

          smoke_directory="$RUNNER_TEMP/mermaid-browser-smoke"
          smoke_source="$smoke_directory/smoke.mmd"
          smoke_output="$smoke_directory/smoke.svg"
          puppeteer_config="$smoke_directory/puppeteer.json"
          rm -rf "$smoke_directory"
          mkdir -p "$smoke_directory"
          printf 'flowchart LR\n  runner[Runner] --> browser[Browser]\n' > "$smoke_source"
          printf '%s\n' \
            '{"args":["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"]}' \
            > "$puppeteer_config"
          PATH="$PWD/node_modules/.bin:$PATH" \
            mmdc -i "$smoke_source" -o "$smoke_output" -b transparent \
              -p "$puppeteer_config"
          test -s "$smoke_output"

      - name: Build documentation
        run: |
          mkdir -p build/docs/site
          PATH="$PWD/node_modules/.bin:$PATH" \
            uv --project docs run mkdocs build --strict --config-file mkdocs.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
